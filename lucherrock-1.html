<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>LUCHER ROCK</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #e63946;
    --dark: #1a1a2e;
    --darker: #0f0f1a;
    --card: #16213e;
    --accent: #f4a261;
    --text: #eaeaea;
    --muted: #8892a4;
    --bubble-me: #e63946;
    --bubble-them: #1e2d4a;
    --green: #2ecc71;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--darker);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── DRUM ICON ── */
  .drum-icon {
    width: 42px; height: 42px;
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  .drum-icon svg { width: 38px; height: 38px; }

  /* ── SCREENS ── */
  .screen { display: none; flex-direction: column; height: 100vh; }
  .screen.active { display: flex; }

  /* ── SPLASH ── */
  #splashScreen {
    background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #0f0f1a 100%);
    align-items: center; justify-content: center; gap: 16px;
  }
  .splash-drum { animation: drumPulse 1.2s ease-in-out infinite; }
  @keyframes drumPulse {
    0%,100% { transform: scale(1); filter: drop-shadow(0 0 8px #e63946); }
    50% { transform: scale(1.12); filter: drop-shadow(0 0 22px #e63946); }
  }
  .splash-drum svg { width: 90px; height: 90px; }
  .splash-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px; letter-spacing: 6px;
    background: linear-gradient(135deg, #e63946, #f4a261);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .splash-sub { color: var(--muted); font-size: 13px; letter-spacing: 2px; }
  .splash-loader {
    width: 60px; height: 4px; background: #1e2d4a; border-radius: 4px; overflow: hidden; margin-top: 20px;
  }
  .splash-loader-bar {
    height: 100%; background: linear-gradient(90deg, #e63946, #f4a261);
    border-radius: 4px; animation: loadBar 1.8s ease forwards;
  }
  @keyframes loadBar { from { width: 0; } to { width: 100%; } }

  /* ── AUTH ── */
  #authScreen {
    background: linear-gradient(160deg, #0f0f1a 0%, #1a1a2e 100%);
    align-items: center; justify-content: center; padding: 24px;
  }
  .auth-logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 32px; gap: 8px; }
  .auth-logo svg { width: 64px; height: 64px; filter: drop-shadow(0 0 12px #e63946); }
  .auth-logo h1 {
    font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 5px;
    background: linear-gradient(135deg, #e63946, #f4a261);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .auth-card {
    background: var(--card); border-radius: 20px; padding: 28px 24px;
    width: 100%; max-width: 380px;
    border: 1px solid rgba(230,57,70,0.15);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .auth-tabs { display: flex; gap: 4px; margin-bottom: 24px; background: var(--darker); border-radius: 12px; padding: 4px; }
  .auth-tab {
    flex: 1; padding: 10px; border: none; background: none; color: var(--muted);
    border-radius: 10px; font-family: 'Nunito', sans-serif; font-weight: 700;
    font-size: 14px; cursor: pointer; transition: all 0.2s;
  }
  .auth-tab.active { background: var(--primary); color: white; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
  .form-group input {
    width: 100%; padding: 12px 16px; background: var(--darker); border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 12px; color: var(--text); font-family: 'Nunito', sans-serif; font-size: 15px;
    outline: none; transition: border-color 0.2s;
  }
  .form-group input:focus { border-color: var(--primary); }
  .btn-primary {
    width: 100%; padding: 14px; background: linear-gradient(135deg, #e63946, #c1121f);
    border: none; border-radius: 12px; color: white; font-family: 'Nunito', sans-serif;
    font-weight: 800; font-size: 16px; cursor: pointer; letter-spacing: 1px;
    transition: transform 0.15s, box-shadow 0.15s; margin-top: 4px;
  }
  .btn-primary:active { transform: scale(0.97); }
  .auth-error { color: #ff6b6b; font-size: 13px; margin-top: 10px; text-align: center; min-height: 20px; }

  /* ── MAIN APP ── */
  #appScreen { background: var(--darker); }

  /* Top bar */
  .topbar {
    background: var(--dark); padding: 12px 16px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
  }
  .topbar .drum-icon svg { width: 32px; height: 32px; }
  .topbar-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 3px; color: var(--primary); flex: 1; }
  .topbar-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px; border: none; background: rgba(255,255,255,0.06);
    border-radius: 10px; color: var(--text); cursor: pointer; display: flex;
    align-items: center; justify-content: center; font-size: 16px; transition: background 0.2s;
  }
  .icon-btn:active { background: rgba(255,255,255,0.12); }

  /* Tabs */
  .tabs {
    display: flex; background: var(--dark);
    border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0;
  }
  .tab {
    flex: 1; padding: 11px 4px; border: none; background: none; color: var(--muted);
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 12px; cursor: pointer;
    border-bottom: 2px solid transparent; transition: all 0.2s; letter-spacing: 0.5px;
  }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* Tab panels */
  .tab-panel { display: none; flex: 1; overflow-y: auto; flex-direction: column; }
  .tab-panel.active { display: flex; }

  /* Chats list */
  .chat-item {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; transition: background 0.15s;
  }
  .chat-item:active { background: rgba(255,255,255,0.04); }
  .avatar {
    width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, #e63946, #f4a261);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px;
    flex-shrink: 0; position: relative;
  }
  .avatar.group { background: linear-gradient(135deg, #1e2d4a, #16213e); border: 2px solid var(--primary); font-size: 20px; }
  .online-dot {
    width: 11px; height: 11px; background: var(--green); border-radius: 50%;
    position: absolute; bottom: 1px; right: 1px; border: 2px solid var(--darker);
  }
  .chat-info { flex: 1; min-width: 0; }
  .chat-name { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
  .chat-last { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .chat-time { color: var(--muted); font-size: 11px; }
  .badge {
    background: var(--primary); color: white; border-radius: 50%; width: 18px; height: 18px;
    font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }

  /* FAB */
  .fab {
    position: fixed; bottom: 24px; right: 20px;
    width: 54px; height: 54px; background: linear-gradient(135deg, #e63946, #c1121f);
    border-radius: 50%; border: none; color: white; font-size: 24px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(230,57,70,0.5); display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s;
  }
  .fab:active { transform: scale(0.93); }

  /* ── CHAT SCREEN ── */
  #chatScreen { background: var(--darker); }
  .chat-topbar {
    background: var(--dark); padding: 10px 14px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0;
  }
  .back-btn {
    width: 34px; height: 34px; border: none; background: none; color: var(--text);
    font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .chat-topbar-info { flex: 1; }
  .chat-topbar-name { font-weight: 800; font-size: 16px; }
  .chat-topbar-status { font-size: 12px; color: var(--green); }

  /* Messages */
  .messages-area {
    flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .msg-row { display: flex; }
  .msg-row.me { justify-content: flex-end; }
  .bubble {
    max-width: 72%; padding: 10px 13px; border-radius: 16px;
    font-size: 14px; line-height: 1.5; position: relative;
    word-break: break-word;
  }
  .msg-row.me .bubble { background: var(--bubble-me); border-bottom-right-radius: 4px; }
  .msg-row.them .bubble { background: var(--bubble-them); border-bottom-left-radius: 4px; }
  .bubble-time { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 4px; text-align: right; }
  .bubble-sender { font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 3px; }

  /* Media bubbles */
  .bubble img, .bubble video {
    max-width: 100%; border-radius: 10px; display: block; margin-bottom: 4px;
  }
  .file-bubble {
    display: flex; align-items: center; gap: 10px; padding: 8px;
    background: rgba(255,255,255,0.08); border-radius: 10px; margin-bottom: 4px;
  }
  .file-bubble-icon { font-size: 28px; }
  .file-bubble-name { font-size: 13px; font-weight: 700; word-break: break-all; }
  .file-bubble-size { font-size: 11px; color: var(--muted); }
  .audio-player { width: 100%; margin-bottom: 4px; }

  /* Input bar */
  .input-bar {
    background: var(--dark); padding: 10px 12px;
    display: flex; align-items: flex-end; gap: 8px; flex-shrink: 0;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .attach-btn, .send-btn {
    width: 40px; height: 40px; border: none; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
  }
  .attach-btn { background: rgba(255,255,255,0.08); color: var(--text); }
  .send-btn { background: var(--primary); color: white; }
  .msg-input {
    flex: 1; background: rgba(255,255,255,0.07); border: none; border-radius: 20px;
    padding: 10px 14px; color: var(--text); font-family: 'Nunito', sans-serif;
    font-size: 14px; outline: none; resize: none; max-height: 100px; min-height: 40px;
    line-height: 1.4;
  }
  .attach-menu {
    position: absolute; bottom: 70px; left: 12px;
    background: var(--card); border-radius: 16px; padding: 8px;
    display: none; gap: 6px; flex-wrap: wrap; max-width: 200px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.08);
  }
  .attach-menu.open { display: flex; }
  .attach-opt {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,0.06);
    cursor: pointer; font-size: 11px; color: var(--muted); font-weight: 700;
    transition: background 0.15s;
  }
  .attach-opt:active { background: rgba(255,255,255,0.12); }
  .attach-opt span:first-child { font-size: 24px; }

  /* Status/Stories panel */
  .status-list { padding: 10px; display: flex; flex-direction: column; gap: 2px; }
  .status-item {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    border-radius: 14px; cursor: pointer; transition: background 0.15s;
  }
  .status-item:active { background: rgba(255,255,255,0.04); }
  .status-avatar {
    width: 50px; height: 50px; border-radius: 50%;
    background: linear-gradient(135deg, #e63946, #f4a261);
    display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800;
    border: 3px solid var(--primary); flex-shrink: 0;
  }
  .status-avatar.unseen { border-color: var(--green); }
  .status-name { font-weight: 700; font-size: 15px; }
  .status-time { font-size: 12px; color: var(--muted); }

  /* Calls panel */
  .calls-list { padding: 10px; display: flex; flex-direction: column; gap: 2px; }
  .call-item {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    border-radius: 14px;
  }
  .call-icon { font-size: 20px; }
  .call-info { flex: 1; }
  .call-name { font-weight: 700; font-size: 15px; }
  .call-detail { font-size: 12px; color: var(--muted); }
  .call-btn {
    width: 38px; height: 38px; border: none; border-radius: 50%;
    background: rgba(46,204,113,0.15); color: var(--green); font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  /* New chat modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100;
    display: none; align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card); border-radius: 24px 24px 0 0; width: 100%;
    padding: 20px; max-height: 70vh; overflow-y: auto;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .modal-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 4px; margin: 0 auto 16px; }
  .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; margin-bottom: 14px; color: var(--primary); }
  .contact-item {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    border-radius: 14px; cursor: pointer; transition: background 0.15s;
  }
  .contact-item:active { background: rgba(255,255,255,0.06); }

  /* Profile panel */
  .profile-panel { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .profile-avatar-big {
    width: 80px; height: 80px; border-radius: 50%;
    background: linear-gradient(135deg, #e63946, #f4a261);
    display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 800;
    border: 3px solid var(--primary);
  }
  .profile-name { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; }
  .profile-username { color: var(--muted); font-size: 14px; }
  .profile-actions { display: flex; gap: 10px; margin-top: 6px; }
  .profile-btn {
    padding: 10px 20px; border-radius: 12px; border: none; cursor: pointer;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px;
  }
  .profile-btn.danger { background: rgba(230,57,70,0.15); color: var(--primary); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

  /* Date divider */
  .date-divider {
    text-align: center; margin: 8px 0;
    color: var(--muted); font-size: 11px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .date-divider::before, .date-divider::after {
    content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06);
  }

  .empty-state {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: var(--muted); padding: 40px;
  }
  .empty-state svg { width: 60px; height: 60px; opacity: 0.3; }
  .empty-state p { text-align: center; font-size: 14px; }
</style>
</head>
<body>

<!-- DRUM SVG template -->
<svg style="display:none" id="drumSVG">
  <symbol id="drum" viewBox="0 0 100 100">
    <ellipse cx="50" cy="30" rx="38" ry="14" fill="#e63946" stroke="#c1121f" stroke-width="2.5"/>
    <rect x="12" y="28" width="76" height="36" rx="4" fill="#c1121f"/>
    <ellipse cx="50" cy="64" rx="38" ry="14" fill="#e63946" stroke="#b01020" stroke-width="2.5"/>
    <line x1="50" y1="16" x2="40" y2="2" stroke="#f4a261" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="16" x2="60" y2="2" stroke="#f4a261" stroke-width="4" stroke-linecap="round"/>
    <circle cx="40" cy="2" r="3" fill="#f4a261"/>
    <circle cx="60" cy="2" r="3" fill="#f4a261"/>
    <line x1="20" y1="34" x2="80" y2="34" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <line x1="20" y1="46" x2="80" y2="46" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <line x1="20" y1="58" x2="80" y2="58" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </symbol>
</svg>

<!-- ═══ SPLASH ═══ -->
<div class="screen active" id="splashScreen">
  <div class="splash-drum">
    <svg viewBox="0 0 100 100" width="90" height="90"><use href="#drum"/></svg>
  </div>
  <div class="splash-title">LUCHER ROCK</div>
  <div class="splash-sub">CONNECT · COMMUNICATE · ROCK</div>
  <div class="splash-loader"><div class="splash-loader-bar"></div></div>
</div>

<!-- ═══ AUTH ═══ -->
<div class="screen" id="authScreen">
  <div class="auth-logo">
    <svg viewBox="0 0 100 100" width="64" height="64"><use href="#drum"/></svg>
    <h1>LUCHER ROCK</h1>
  </div>
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login')">Sign In</button>
      <button class="auth-tab" onclick="switchAuthTab('register')">Sign Up</button>
    </div>
    <!-- Login -->
    <div id="loginForm">
      <div class="form-group">
        <label>Username or Phone</label>
        <input type="text" id="loginUser" placeholder="Enter username" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPw" placeholder="Enter password">
      </div>
      <button class="btn-primary" onclick="doLogin()">SIGN IN 🥁</button>
      <div class="auth-error" id="loginError"></div>
    </div>
    <!-- Register -->
    <div id="registerForm" style="display:none">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="Your full name">
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="regUser" placeholder="Choose a username">
      </div>
      <div class="form-group">
        <label>Phone (optional)</label>
        <input type="tel" id="regPhone" placeholder="+256 ...">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPw" placeholder="Min 6 characters">
      </div>
      <button class="btn-primary" onclick="doRegister()">CREATE ACCOUNT 🥁</button>
      <div class="auth-error" id="registerError"></div>
    </div>
  </div>
</div>

<!-- ═══ MAIN APP ═══ -->
<div class="screen" id="appScreen">
  <div class="topbar">
    <div class="drum-icon"><svg viewBox="0 0 100 100"><use href="#drum"/></svg></div>
    <div class="topbar-title">LUCHER ROCK</div>
    <div class="topbar-actions">
      <button class="icon-btn" onclick="showTab('profile')" title="Profile">👤</button>
      <button class="icon-btn" onclick="doLogout()" title="Logout">🚪</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('chats')">💬 Chats</button>
    <button class="tab" onclick="showTab('status')">🔵 Status</button>
    <button class="tab" onclick="showTab('calls')">📞 Calls</button>
    <button class="tab" onclick="showTab('profile')">👤 Me</button>
  </div>

  <!-- Chats -->
  <div class="tab-panel active" id="tab-chats">
    <div id="chatsList"></div>
  </div>

  <!-- Status -->
  <div class="tab-panel" id="tab-status">
    <div class="status-list" id="statusList"></div>
  </div>

  <!-- Calls -->
  <div class="tab-panel" id="tab-calls">
    <div class="calls-list" id="callsList"></div>
  </div>

  <!-- Profile -->
  <div class="tab-panel" id="tab-profile">
    <div class="profile-panel" id="profilePanel"></div>
  </div>

  <button class="fab" onclick="openNewChat()">✏️</button>
</div>

<!-- ═══ CHAT SCREEN ═══ -->
<div class="screen" id="chatScreen" style="position:fixed;inset:0;z-index:50;">
  <div class="chat-topbar">
    <button class="back-btn" onclick="backToChats()">←</button>
    <div class="avatar" id="chatAvatar" style="width:36px;height:36px;font-size:15px;"></div>
    <div class="chat-topbar-info" style="margin-left:6px;">
      <div class="chat-topbar-name" id="chatName"></div>
      <div class="chat-topbar-status" id="chatStatus">online</div>
    </div>
    <button class="icon-btn">📞</button>
    <button class="icon-btn">📹</button>
  </div>
  <div class="messages-area" id="messagesArea"></div>
  <div style="position:relative;">
    <div class="attach-menu" id="attachMenu">
      <div class="attach-opt" onclick="triggerFile('image/*')"><span>🖼️</span><span>Photo</span></div>
      <div class="attach-opt" onclick="triggerFile('video/*')"><span>🎥</span><span>Video</span></div>
      <div class="attach-opt" onclick="triggerFile('audio/*')"><span>🎵</span><span>Audio</span></div>
      <div class="attach-opt" onclick="triggerFile('*/*')"><span>📁</span><span>File</span></div>
    </div>
  </div>
  <div class="input-bar">
    <button class="attach-btn" onclick="toggleAttach()">📎</button>
    <textarea class="msg-input" id="msgInput" placeholder="Message..." rows="1"
      oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>
  <input type="file" id="fileInput" style="display:none" onchange="handleFileSelect(event)">
</div>

<!-- New Chat Modal -->
<div class="modal-overlay" id="newChatModal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">New Chat</div>
    <div id="contactsList"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
//  FIREBASE CONFIG
// ══════════════════════════════════════════════
const FB_CONFIG = {
  apiKey: "AIzaSyDATo0yh03l8z5jOJDM9lv87JXera8Nr2g",
  authDomain: "schoolpro-896ac.firebaseapp.com",
  projectId: "schoolpro-896ac",
  storageBucket: "schoolpro-896ac.appspot.com",
  messagingSenderId: "807007053293",
  appId: "1:807007053293:web:c1abfe8b2686b0c4f0b0cf"
};

// Load Firebase
const fbScript = document.createElement('script');
fbScript.src = 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js';
fbScript.onload = () => {
  const fsScript = document.createElement('script');
  fsScript.src = 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js';
  fsScript.onload = initApp;
  document.head.appendChild(fsScript);
};
document.head.appendChild(fbScript);

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let db, currentUser = null, activeChatId = null, msgUnsub = null;
const COLORS = ['#e63946','#f4a261','#2ecc71','#3498db','#9b59b6','#e67e22'];

function getColor(str) {
  let h = 0; for (let c of str) h = (h * 31 + c.charCodeAt(0)) % COLORS.length;
  return COLORS[h];
}
function initials(name) { return name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function formatTime(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
function formatDay(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const today = new Date(); const yesterday = new Date(today); yesterday.setDate(today.getDate()-1);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString();
}

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
function initApp() {
  firebase.initializeApp(FB_CONFIG);
  db = firebase.firestore();
  // Splash → Auth after 2s
  // Show auth immediately, don't wait for Firebase
  showScreen('authScreen');
  const saved = localStorage.getItem('lr_user');
  if (saved) { currentUser = JSON.parse(saved); enterApp(); }
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).style.display = '';
  document.getElementById(id).classList.add('active');
}

// ══════════════════════════════════════════════
//  AUTH
// ══════════════════════════════════════════════
function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('loginForm').style.display = tab==='login' ? '' : 'none';
  document.getElementById('registerForm').style.display = tab==='register' ? '' : 'none';
}

async function doRegister() {
  const name = document.getElementById('regName').value.trim();
  const username = document.getElementById('regUser').value.trim().toLowerCase();
  const phone = document.getElementById('regPhone').value.trim();
  const pw = document.getElementById('regPw').value;
  const err = document.getElementById('registerError');
  if (!name || !username || !pw) { err.textContent = 'Please fill all required fields'; return; }
  if (pw.length < 6) { err.textContent = 'Password must be at least 6 characters'; return; }
  try {
    const existing = await db.collection('lr_users').doc(username).get();
    if (existing.exists) { err.textContent = 'Username already taken'; return; }
    const user = { name, username, phone, pw: btoa(pw), color: getColor(username), createdAt: firebase.firestore.FieldValue.serverTimestamp() };
    await db.collection('lr_users').doc(username).set(user);
    currentUser = user; currentUser.pw = undefined;
    localStorage.setItem('lr_user', JSON.stringify({...user, pw: undefined}));
    enterApp();
  } catch(e) { err.textContent = 'Error: ' + e.message; }
}

async function doLogin() {
  const user = document.getElementById('loginUser').value.trim().toLowerCase();
  const pw = document.getElementById('loginPw').value;
  const err = document.getElementById('loginError');
  if (!user || !pw) { err.textContent = 'Please enter username and password'; return; }
  try {
    const doc = await db.collection('lr_users').doc(user).get();
    if (!doc.exists) { err.textContent = 'User not found'; return; }
    const data = doc.data();
    if (atob(data.pw) !== pw) { err.textContent = 'Wrong password'; return; }
    currentUser = {...data, pw: undefined};
    localStorage.setItem('lr_user', JSON.stringify(currentUser));
    enterApp();
  } catch(e) { err.textContent = 'Error: ' + e.message; }
}

function doLogout() {
  localStorage.removeItem('lr_user');
  currentUser = null; activeChatId = null;
  if (msgUnsub) { msgUnsub(); msgUnsub = null; }
  showScreen('authScreen');
}

function enterApp() {
  showScreen('appScreen');
  loadChats();
  renderProfile();
  renderStatus();
  renderCalls();
}

// ══════════════════════════════════════════════
//  TABS
// ══════════════════════════════════════════════
function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  const idx = ['chats','status','calls','profile'].indexOf(tab);
  document.querySelectorAll('.tab')[idx].classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  const fab = document.querySelector('.fab');
  fab.style.display = tab === 'chats' ? '' : 'none';
  if (tab === 'profile') renderProfile();
}

// ══════════════════════════════════════════════
//  CHATS LIST
// ══════════════════════════════════════════════
function loadChats() {
  const el = document.getElementById('chatsList');
  // Listen to conversations involving current user
  db.collection('lr_conversations')
    .where('members', 'array-contains', currentUser.username)
    .orderBy('lastAt', 'desc')
    .onSnapshot(snap => {
      if (snap.empty) {
        el.innerHTML = `<div class="empty-state"><svg viewBox="0 0 100 100"><use href="#drum"/></svg><p>No chats yet.<br>Tap ✏️ to start a conversation!</p></div>`;
        return;
      }
      el.innerHTML = snap.docs.map(doc => {
        const d = doc.data();
        const other = d.type === 'group' ? null : d.members.find(m => m !== currentUser.username);
        const name = d.type === 'group' ? d.name : (d.names?.[other] || other);
        const av = d.type === 'group' ? `<div class="avatar group">👥</div>` :
          `<div class="avatar" style="background:${getColor(other||'')}">${initials(name||'?')}<div class="online-dot"></div></div>`;
        const time = d.lastAt ? formatTime(d.lastAt) : '';
        const last = d.lastMsg || '';
        return `<div class="chat-item" onclick="openChat('${doc.id}','${name}','${d.type||'dm'}','${other||''}')">
          ${av}
          <div class="chat-info">
            <div class="chat-name">${name}</div>
            <div class="chat-last">${last}</div>
          </div>
          <div class="chat-meta">
            <div class="chat-time">${time}</div>
          </div>
        </div>`;
      }).join('');
    }, err => {
      // Index not ready, show empty
      el.innerHTML = `<div class="empty-state"><svg viewBox="0 0 100 100"><use href="#drum"/></svg><p>Tap ✏️ to start chatting!</p></div>`;
    });
}

// ══════════════════════════════════════════════
//  NEW CHAT
// ══════════════════════════════════════════════
async function openNewChat() {
  const modal = document.getElementById('newChatModal');
  const list = document.getElementById('contactsList');
  list.innerHTML = '<div style="color:var(--muted);padding:10px;text-align:center">Loading...</div>';
  modal.classList.add('open');
  try {
    const snap = await db.collection('lr_users').get();
    const users = snap.docs.filter(d => d.id !== currentUser.username);
    if (!users.length) {
      list.innerHTML = '<div style="color:var(--muted);padding:10px;text-align:center">No other users yet. Share the app!</div>';
      return;
    }
    list.innerHTML = users.map(d => {
      const u = d.data();
      return `<div class="contact-item" onclick="startDM('${u.username}','${u.name}')">
        <div class="avatar" style="width:42px;height:42px;font-size:16px;background:${getColor(u.username)}">${initials(u.name)}</div>
        <div><div style="font-weight:700">${u.name}</div><div style="color:var(--muted);font-size:12px">@${u.username}</div></div>
      </div>`;
    }).join('');
  } catch(e) { list.innerHTML = '<div style="color:#ff6b6b;padding:10px">Error loading users</div>'; }
}

async function startDM(username, name) {
  closeModal();
  // Check if conversation already exists
  const id1 = [currentUser.username, username].sort().join('_');
  const ref = db.collection('lr_conversations').doc(id1);
  const doc = await ref.get();
  if (!doc.exists) {
    await ref.set({
      type: 'dm', members: [currentUser.username, username],
      names: {[currentUser.username]: currentUser.name, [username]: name},
      lastMsg: '', lastAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }
  openChat(id1, name, 'dm', username);
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('newChatModal')) {
    document.getElementById('newChatModal').classList.remove('open');
  }
}

// ══════════════════════════════════════════════
//  OPEN CHAT
// ══════════════════════════════════════════════
function openChat(chatId, name, type, other) {
  activeChatId = chatId;
  document.getElementById('chatName').textContent = name;
  document.getElementById('chatAvatar').textContent = initials(name);
  document.getElementById('chatAvatar').style.background = getColor(other||name);
  document.getElementById('chatScreen').classList.add('active');
  document.getElementById('chatScreen').style.display = 'flex';
  loadMessages(chatId);
}

function backToChats() {
  document.getElementById('chatScreen').classList.remove('active');
  document.getElementById('chatScreen').style.display = 'none';
  if (msgUnsub) { msgUnsub(); msgUnsub = null; }
  activeChatId = null;
}

// ══════════════════════════════════════════════
//  MESSAGES
// ══════════════════════════════════════════════
function loadMessages(chatId) {
  const area = document.getElementById('messagesArea');
  area.innerHTML = '';
  if (msgUnsub) msgUnsub();
  msgUnsub = db.collection('lr_conversations').doc(chatId)
    .collection('messages').orderBy('at', 'asc')
    .onSnapshot(snap => {
      area.innerHTML = '';
      let lastDay = '';
      snap.docs.forEach(doc => {
        const m = doc.data();
        const day = m.at ? formatDay(m.at) : '';
        if (day && day !== lastDay) {
          area.innerHTML += `<div class="date-divider">${day}</div>`;
          lastDay = day;
        }
        area.innerHTML += renderBubble(m);
      });
      area.scrollTop = area.scrollHeight;
    });
}

function renderBubble(m) {
  const isMe = m.sender === currentUser.username;
  const time = formatTime(m.at);
  let content = '';
  if (m.type === 'text') content = `<div>${escHtml(m.text)}</div>`;
  else if (m.type === 'image') content = `<img src="${m.url}" onclick="window.open(this.src)">`;
  else if (m.type === 'video') content = `<video src="${m.url}" controls></video>`;
  else if (m.type === 'audio') content = `<audio class="audio-player" src="${m.url}" controls></audio>`;
  else if (m.type === 'file') content = `<div class="file-bubble" onclick="window.open('${m.url}')">
    <div class="file-bubble-icon">📄</div>
    <div><div class="file-bubble-name">${escHtml(m.fileName||'File')}</div>
    <div class="file-bubble-size">${m.fileSize||''}</div></div></div>`;
  const senderLine = !isMe ? `<div class="bubble-sender">${m.senderName||m.sender}</div>` : '';
  return `<div class="msg-row ${isMe?'me':'them'}">
    <div class="bubble">${senderLine}${content}<div class="bubble-time">${time}${isMe?' ✓✓':''}</div></div>
  </div>`;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ══════════════════════════════════════════════
//  SEND TEXT
// ══════════════════════════════════════════════
async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !activeChatId) return;
  input.value = ''; input.style.height = '';
  const msg = {
    type: 'text', text, sender: currentUser.username,
    senderName: currentUser.name, at: firebase.firestore.FieldValue.serverTimestamp()
  };
  await db.collection('lr_conversations').doc(activeChatId).collection('messages').add(msg);
  await db.collection('lr_conversations').doc(activeChatId).update({ lastMsg: text, lastAt: firebase.firestore.FieldValue.serverTimestamp() });
}

function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function autoResize(el) { el.style.height = ''; el.style.height = Math.min(el.scrollHeight, 100) + 'px'; }

// ══════════════════════════════════════════════
//  ATTACH / FILES
// ══════════════════════════════════════════════
let fileAccept = '*/*';
function toggleAttach() {
  document.getElementById('attachMenu').classList.toggle('open');
}
function triggerFile(accept) {
  fileAccept = accept;
  document.getElementById('attachMenu').classList.remove('open');
  const fi = document.getElementById('fileInput');
  fi.accept = accept; fi.value = ''; fi.click();
}

async function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file || !activeChatId) return;
  // Convert to base64 and store in Firestore (for small files)
  const MAX = 900 * 1024; // 900KB limit for Firestore
  if (file.size > MAX) {
    alert('File too large! Max 900KB. For larger files, use a file sharing link.');
    return;
  }
  const reader = new FileReader();
  reader.onload = async (ev) => {
    const url = ev.target.result;
    let type = 'file';
    if (file.type.startsWith('image/')) type = 'image';
    else if (file.type.startsWith('video/')) type = 'video';
    else if (file.type.startsWith('audio/')) type = 'audio';
    const msg = {
      type, url, fileName: file.name,
      fileSize: (file.size/1024).toFixed(1)+'KB',
      sender: currentUser.username, senderName: currentUser.name,
      at: firebase.firestore.FieldValue.serverTimestamp()
    };
    await db.collection('lr_conversations').doc(activeChatId).collection('messages').add(msg);
    await db.collection('lr_conversations').doc(activeChatId).update({ lastMsg: `📎 ${file.name}`, lastAt: firebase.firestore.FieldValue.serverTimestamp() });
  };
  reader.readAsDataURL(file);
}

// ══════════════════════════════════════════════
//  STATUS
// ══════════════════════════════════════════════
function renderStatus() {
  document.getElementById('statusList').innerHTML = `
    <div style="padding:12px 12px 4px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px">MY STATUS</div>
    <div class="status-item">
      <div class="status-avatar" style="border-color:var(--muted)">+</div>
      <div><div class="status-name">Add Status</div><div class="status-time">Share a photo or update</div></div>
    </div>
    <div style="padding:12px 12px 4px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px">RECENT UPDATES</div>
    <div class="empty-state" style="padding:30px"><p style="color:var(--muted)">No status updates yet</p></div>`;
}

// ══════════════════════════════════════════════
//  CALLS
// ══════════════════════════════════════════════
function renderCalls() {
  document.getElementById('callsList').innerHTML = `
    <div class="empty-state" style="padding:40px">
      <div style="font-size:48px">📞</div>
      <p style="color:var(--muted)">No recent calls</p>
    </div>`;
}

// ══════════════════════════════════════════════
//  PROFILE
// ══════════════════════════════════════════════
function renderProfile() {
  if (!currentUser) return;
  document.getElementById('profilePanel').innerHTML = `
    <div class="profile-avatar-big" style="background:${getColor(currentUser.username||'')}">
      ${initials(currentUser.name||'?')}
    </div>
    <div class="profile-name">${currentUser.name}</div>
    <div class="profile-username">@${currentUser.username}</div>
    ${currentUser.phone ? `<div style="color:var(--muted);font-size:13px">📞 ${currentUser.phone}</div>` : ''}
    <div class="profile-actions">
      <button class="profile-btn danger" onclick="doLogout()">🚪 Sign Out</button>
    </div>
    <div style="margin-top:20px;padding:16px;background:var(--card);border-radius:16px;width:100%;text-align:center">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">SHARE YOUR LINK</div>
      <div style="font-size:13px;font-weight:700;color:var(--primary)">${window.location.href}</div>
    </div>`;
}
</script>
</body>
</html>
